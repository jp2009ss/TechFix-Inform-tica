<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento de Serviços</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Parte de cima do site -->
  <header class="cabecalho">
    <h1>TechFix Informática</h1>
    <p>Soluções tecnológicas para o seu negócio</p>
  </header>

  <!-- Campos De preenchmento -->
  <div class="conteudo">

<!-- Campo de Nome -->
    <div class="campo">
      <label for="nomeCliente">Nome do Cliente:</label>
      <input type="text" id="nomeCliente" placeholder="Digite o nome do cliente">
    </div>

<!-- Campo de Email -->
    <div class="campo">
      <label for="emailCliente">Email do Cliente:</label>
      <input type="email" id="emailCliente" placeholder="Digite o email do cliente">
    </div>

<!-- Campo de Selecionar -->
    <div class="campo">
      <label for="servico">Escolha o serviço:</label>
      <select id="servico">
        <option value="">Selecione...</option>
        <option value="Formatação de computador" data-preco="120">Formatação de computador — R$ 120,00</option>
        <option value="Instalação de programas" data-preco="50">Instalação de programas — R$ 50,00</option>
        <option value="Limpeza física" data-preco="80">Limpeza física — R$ 80,00</option>
        <option value="Troca de peça (HD/SSD/Memória)" data-preco="150">Troca de peça (HD/SSD/Memória) — R$ 150,00</option>
        <option value="Remoção de vírus" data-preco="100">Remoção de vírus — R$ 100,00</option>
        <option value="Backup de dados" data-preco="70">Backup de dados — R$ 70,00</option>
      </select>
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" placeholder="Descreva o serviço necessário">
    </div>

<!-- Mensagem de erro -->
    <p id="erro" class="erro">Preencha todos os campos antes de calcular.</p>

<!-- Botão Calcular -->
    <button id="btnCalcular">Calcular Orçamento</button>

<!-- Resultado -->
    <div id="resultado" class="resultado"></div><br><br><br><br><br>

<!-- Rodapé -->
 <footer>
    <center><p>&copy; 2026 TechFix Informática. Todos os direitos reservados.</p></center> 
  </footer>

  <script src="script.js"></script>
</body>
</html>
